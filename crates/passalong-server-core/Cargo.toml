[package]
name = "passalong-server-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "passalong server domain: configuration, workspaces, API keys, and the item store"

[features]
# Test support: named places where the kill harness aborts the process.
# Never enabled in the server's build; see src/fault.rs.
fault-injection = []

[[bin]]
# Test support for tests/kill.rs and tests/two_processes.rs; see its docs.
name = "storage_child"
path = "src/bin/storage_child.rs"
required-features = ["fault-injection"]

[dependencies]
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
