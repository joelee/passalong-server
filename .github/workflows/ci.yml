name: CI

# Every push to every branch, and every pull request: `just ci`, which is what
# a developer runs before pushing. It publishes nothing; only a release tag
# does (release.yml).
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (just ci)
    # `just ci` builds the image and runs both installations end to end.
    # scripts/test-service.sh needs Docker 28 or later, for writable cgroups
    # in a container that is NOT privileged; it says so if the runner's is older.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny,cargo-about,just
      - run: docker version --format 'Docker {{.Server.Version}}'
      - run: just ci
