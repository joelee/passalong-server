name: Release

# Pushing a tag vX.Y.Z checks the release records, builds the multi-arch
# image, and, once a maintainer approves the `release` environment, pushes
# it to Docker Hub and creates the GitHub release. DRAFT: review the image
# name and add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to the
# `release` environment before the first tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: joelee/passalong-server

jobs:
  verify:
    name: Check the tag and build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and arm64 without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-to: type=gha,mode=max

  publish:
    name: Push to Docker Hub and create the GitHub release
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags X.Y.Z, X.Y, and latest
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "list<<EOF"
            echo "$IMAGE:$version"
            echo "$IMAGE:${version%.*}"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
      - name: Create the GitHub release from the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "docs/release/$GITHUB_REF_NAME.md"
