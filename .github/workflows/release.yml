name: Release

# Pushing a tag vX.Y.Z checks the release records and verifies the build:
# the workspace, and the image for amd64 and arm64. It publishes nothing: no
# image is pushed and no GitHub release is created, because the server is
# proprietary and not distributed (IDEA-00001 r03, decision of 2026-09-18).
# A publish job returns here once a licence is chosen; see docs/backlog.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Check the tag and verify the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p passalong-server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for amd64 and arm64 without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
