[workspace]
resolver = "3"
members = [
    "crates/passalong-server-core",
    "crates/passalong-server-api",
    "crates/passalong-server-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Proprietary for now: see LICENSE. Never published to crates.io.
license-file = "LICENSE"
publish = false
repository = "https://github.com/joelee/passalong-server"
description = "Self-hosted HTTPS server for passalong: clipboard and file sharing between your devices"
homepage = "https://github.com/joelee/passalong-server"

# Third-party requirements are caret requirements; the committed Cargo.lock
# and `--locked` keep builds reproducible. The workspace crates pin each
# other exactly. Third-party crates are added here by the plan that first
# needs them; docs/architecture.md, "Planned stack", lists the candidates.
[workspace.dependencies]
passalong-server-core = { path = "crates/passalong-server-core", version = "=0.1.0" }
passalong-server-api = { path = "crates/passalong-server-api", version = "=0.1.0" }

# SQLite compiled in, so the image and a systemd host need no system library.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Without `attributes`: `#[instrument]` would bring a second version of `syn`.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Test-only
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
strip = true
lto = "thin"
