# passalong-server with Docker Compose. DRAFT: works once `serve` exists.
#
#   cp .env.sample .env        # then edit
#   docker compose build       # no image is published: build it here
#   docker compose up -d
#   docker compose exec server passalong-server workspace create home
#   docker compose exec server passalong-server key create --workspace home --label laptop --expires 90d
#
# Admin commands always run inside the container, against the same data
# directory the server uses; nothing is managed over the network.
services:
  server:
    # Built from this repository; nothing is pulled from a registry.
    build:
      context: ../..
    image: passalong-server:local
    restart: unless-stopped
    ports:
      - "${PASSALONG_SERVER_PORT:-8443}:8443"
    volumes:
      - "${PASSALONG_SERVER_DATA:-./data}:/var/lib/passalong-server"
      - "./config.toml:/etc/passalong-server/config.toml:ro"
      - "${PASSALONG_SERVER_TLS:-./tls}:/etc/passalong-server/tls:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
