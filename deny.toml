# cargo-deny policy. Run with `just audit`; CI runs it on every push.

[graph]
all-features = true
# The platforms the server supports: Linux only.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]

[licenses]
# Permissive licences only, which matters twice here: the server is
# proprietary, so a copyleft dependency could not be shipped at all.
# A dependency offering several licences is accepted when any is listed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates carry the proprietary LICENSE and are never
# published.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
