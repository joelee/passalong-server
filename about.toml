# cargo-about: what THIRD-PARTY-NOTICES is made from. `just notices` writes
# the file; `just ci` fails when it is stale.
#
# The accepted licences are those of deny.toml, and must stay the same list:
# a licence refused there cannot be accepted here.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# What is distributed is the binary: what it links, on the two platforms it
# is built for.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# The workspace's own crates are AGPL-3.0-or-later: see LICENSE.
private = { ignore = true }
